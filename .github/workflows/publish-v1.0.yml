name: publish-v1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Republish the v1.0 release at the current commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0 -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "removing the existing v1.0 release and tag"
            gh release delete v1.0 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          cat > /tmp/notes.md <<'EOF'
          Stable, citable version of the MrBeast channel case study dossier.

          ## Headline numbers

          - Videos processed: 3
          - Music cues found: 12
          - Repositories found: 3
          - Repositories excluded: 1

          ## Contents

          - `README.md` — headline numbers and method
          - `research_report.md` — the dossier (Videos, Music Credits, Repositories, Excluded)

          Tagged `v1.0` so the dossier can be cited as a stable version.
          EOF
          gh release create v1.0 -R "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "v1.0 - MrBeast research dossier" \
            --notes-file /tmp/notes.md
