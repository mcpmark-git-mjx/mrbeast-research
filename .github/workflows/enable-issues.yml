name: enable-issues

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable the issue tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f has_issues=true