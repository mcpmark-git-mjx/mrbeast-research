name: file-exclusion-issues

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  file-issues:
    runs-on: ubuntu-latest
    steps:
      - name: File the exclusion issue for ChannelDataTools/yt-data-fetcher
        id: issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/body.md <<'EOF'
          This repository was **excluded** from the MrBeast channel case study dossier.

          **Reason: the 30-star minimum rule.** The study's editorial rule requires a repository to have at least 30 stars to be included. Anything below that threshold is excluded and flagged, never silently dropped.

          **Repository:** ChannelDataTools/yt-data-fetcher
          **URL:** https://github.com/ChannelDataTools/yt-data-fetcher
          **Actual star count: 23** — which is below the 30-star minimum, so it falls short by 7 stars.

          - Stars: 23
          - Primary language: Python
          - Description: Lightweight fetcher for YouTube channel data using oEmbed and watch pages

          Recorded in the `## Excluded` section of `research_report.md` so the exclusion is auditable rather than silent.
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Excluded: ChannelDataTools/yt-data-fetcher" \
            --body-file /tmp/body.md

      - name: Report the issue step outcome
        run: echo "issue_step_outcome=${{ steps.issue.outcome }}"

      - name: Rewrite the v1.0 release notes cleanly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          Stable, citable version of the MrBeast channel case study dossier.

          ## Headline numbers

          - Videos processed: 3
          - Music cues found: 12
          - Repositories found: 3
          - Repositories excluded: 1

          ## Contents

          - `README.md` — headline numbers and method
          - `research_report.md` — the dossier (Videos, Music Credits, Repositories, Excluded)

          Tagged `v1.0` so the dossier can be cited as a stable version.
          EOF
          gh release edit v1.0 -R "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
